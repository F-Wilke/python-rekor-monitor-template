[tool.poetry]
name = "python-rekor-monitor-template"
version = "0.1.0"
description = "Rekor transparency log verification utilities"
authors = ["Project contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = ">=2.31,<3"
cryptography = ">=42,<47"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
mypy = "^1.18.0"
bandit = "^1.8.0"
types-requests = ">=2.31,<3"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "merkle_proof.py", "util.py"]
ignore_missing_imports = true
warn_unused_configs = true
exclude = "baseline"

[tool.bandit]
exclude_dirs = [".git", ".venv", "baseline", "tests"]
targets = ["main.py", "merkle_proof.py", "util.py"]
