name: Assignment 2 quality reports
on:
  workflow_dispatch:
  push:
    branches: [assignment-2-quality-tools]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install 'poetry>=2,<3'
          poetry config virtualenvs.in-project true --local
          poetry lock
          poetry install --no-interaction
      - name: Collect assignment 1 baseline reports
        shell: bash
        run: |
          mkdir -p reports baseline
          git archive 76e8d54c3b2bde02bab7c92dee23fdb7a4023731 | tar -x -C baseline
          pushd baseline
          set +e
          ../.venv/bin/ruff check main.py merkle_proof.py util.py -o ../reports/ruff.initial.txt
          ../.venv/bin/ruff format --check main.py merkle_proof.py util.py > ../reports/formatter.initial.txt 2>&1
          ../.venv/bin/mypy --config-file ../pyproject.toml main.py merkle_proof.py util.py > ../reports/mypy.initial.txt 2>&1
          ../.venv/bin/bandit -r main.py merkle_proof.py util.py -o ../reports/bandit.initial.txt -f txt
          popd
      - name: Auto-fix lint and format, then commit lockfile
        shell: bash
        run: |
          poetry run ruff check --fix main.py merkle_proof.py util.py
          poetry run ruff format main.py merkle_proof.py util.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock main.py merkle_proof.py util.py
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Ruff formatting and lock Poetry dependencies'
            git push
          fi
      - name: Run tests and enforce coverage
        run: |
          poetry run pytest --cov=main --cov=merkle_proof --cov=util --cov-report=term-missing --cov-report=html --cov-fail-under=75 | tee coverage-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: |
            coverage-output.txt
            htmlcov/
      - name: Collect final reports
        shell: bash
        run: |
          set +e
          poetry run ruff check main.py merkle_proof.py util.py -o reports/ruff.final.txt
          poetry run ruff format --check main.py merkle_proof.py util.py > reports/formatter.final.txt 2>&1
          poetry run mypy main.py merkle_proof.py util.py > reports/mypy.final.txt 2>&1
          poetry run bandit -r main.py merkle_proof.py util.py -o reports/bandit.final.txt -f txt
          cd reports && zip ../quality-reports.zip *.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality-reports.zip
      - name: Enforce quality
        run: |
          poetry run ruff check main.py merkle_proof.py util.py
          poetry run ruff format --check main.py merkle_proof.py util.py
          poetry run mypy main.py merkle_proof.py util.py
